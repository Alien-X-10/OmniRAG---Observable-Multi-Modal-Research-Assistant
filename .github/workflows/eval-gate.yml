# File: .github/workflows/eval-gate.yml
name: OmniRAG LLM-as-a-Judge Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate-rag-accuracy:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      DB_NAME: omnirag
      COLLECTION_NAME: video_chunks
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EVAL_PASS_THRESHOLD: "1.0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Seed Corpus in MongoDB Atlas
        run: node src/ingestion/ytIngest.js --mock

      - name: Run LLM-as-a-Judge Evaluation Gate (Gemini 3.1 Flash-Lite)
        run: node evals/runEvals.js